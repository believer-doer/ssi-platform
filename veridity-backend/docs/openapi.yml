components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Driver:
      name: driver
      in: path
      required: true
      schema:
        type: string
        enum:
        - internal
        - ethereum
        - bitcoin
    Protocol:
      name: protocol
      in: path
      required: true
      schema:
        type: string
        enum:
        - oidc4vci
        - oidc4vp
        - siopv2
        - dcql
        - didcomm-v2
        - aries
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Did:
      name: did
      in: path
      required: true
      schema:
        type: string
    TenantQuery:
      name: tenantId
      in: query
      required: false
      schema:
        type: string
    TenantHeader:
      name: x-tenant-id
      in: header
      required: false
      schema:
        type: string
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
