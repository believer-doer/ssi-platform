openapi: 3.1.0
info:
  title: SSI Platform API
  version: 0.3.0
  description: 'OpenAPI contract for the current SSI Platform backend. The API exposes onboarding, schema/template management,
    credential issuance and verification, presentation flows, trust registry, governance, protocol sessions, audit retrieval,
    and revocation list operations across multiple SSI drivers.

    '
servers:
- url: http://localhost:4000/v1
  description: Local API server
tags:
- name: Issuers
- name: Verifiers
- name: Wallets
- name: Schemas
- name: Templates
- name: Credentials
- name: Presentations
- name: Verification
- name: Tenants
- name: Trust
- name: Governance
- name: Protocols
- name: Audit
- name: Revocation
- name: System
  description: Operational health, readiness, and session context endpoints.
security:
- BearerAuth: []
paths:
  /{driver}/issuers:
    post:
      tags:
      - Issuers
      summary: Create an issuer record in pending state
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssuerOnboardRequest'
            examples:
              internal-key-issuer:
                $ref: '#/components/examples/internal-key-issuer-request'
              ethereum-ethr-issuer:
                $ref: '#/components/examples/ethereum-ethr-issuer-request'
      responses:
        '200':
          description: Issuer onboarded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuerRecord'
              examples:
                internal-key-issuer:
                  $ref: '#/components/examples/internal-key-issuer-response'
                ethereum-ethr-issuer:
                  $ref: '#/components/examples/ethereum-ethr-issuer-response'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
      - Issuers
      summary: List issuers
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/TenantQuery'
      responses:
        '200':
          description: Issuers returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IssuerRecord'
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/issuers/{did}/activate:
    post:
      tags:
      - Issuers
      summary: Activate an issuer after governance approval
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/Did'
      responses:
        '200':
          description: Issuer activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuerRecord'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/issuers/{did}:
    get:
      tags:
      - Issuers
      summary: Get issuer by DID
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/Did'
      responses:
        '200':
          description: Issuer returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuerRecord'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/verifiers:
    post:
      tags:
      - Verifiers
      summary: Create a verifier record in pending state
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifierOnboardRequest'
      responses:
        '200':
          description: Verifier onboarded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifierRecord'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
      - Verifiers
      summary: List verifiers
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/TenantQuery'
      responses:
        '200':
          description: Verifiers returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VerifierRecord'
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/verifiers/{did}/activate:
    post:
      tags:
      - Verifiers
      summary: Activate a verifier after governance approval
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/Did'
      responses:
        '200':
          description: Verifier activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifierRecord'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/verifiers/{did}:
    get:
      tags:
      - Verifiers
      summary: Get verifier by DID
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/Did'
      responses:
        '200':
          description: Verifier returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifierRecord'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/wallets:
    post:
      tags:
      - Wallets
      summary: Onboard a wallet
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletOnboardRequest'
            examples:
              internal-wallet:
                $ref: '#/components/examples/internal-wallet-request'
              ethereum-wallet:
                $ref: '#/components/examples/ethereum-wallet-request'
              bitcoin-wallet:
                $ref: '#/components/examples/bitcoin-wallet-request'
      responses:
        '200':
          description: Wallet onboarded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletOnboardResponse'
              examples:
                internal-wallet:
                  $ref: '#/components/examples/internal-wallet-response'
                ethereum-wallet:
                  $ref: '#/components/examples/ethereum-wallet-response'
                bitcoin-wallet:
                  $ref: '#/components/examples/bitcoin-wallet-response'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
      - Wallets
      summary: List wallets
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/TenantQuery'
      responses:
        '200':
          description: Wallets returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WalletRecord'
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/wallets/{did}:
    get:
      tags:
      - Wallets
      summary: Get wallet by DID
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/Did'
      responses:
        '200':
          description: Wallet returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletRecord'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/schemas:
    post:
      tags:
      - Schemas
      summary: Register a schema in inactive state
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaRegisterRequest'
      responses:
        '200':
          description: Schema registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaRecord'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
      - Schemas
      summary: List schemas
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/TenantQuery'
      responses:
        '200':
          description: Schemas returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchemaRecord'
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/schemas/{id}/activate:
    post:
      tags:
      - Schemas
      summary: Activate a schema after governance approval
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Schema activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaRecord'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/schemas/{id}:
    get:
      tags:
      - Schemas
      summary: Get schema by id
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Schema returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaRecord'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/templates:
    post:
      tags:
      - Templates
      summary: Register a credential template in disabled state
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateRegisterRequest'
      responses:
        '200':
          description: Template registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateRecord'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
      - Templates
      summary: List templates
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/TenantQuery'
      responses:
        '200':
          description: Templates returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemplateRecord'
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/templates/{id}/activate:
    post:
      tags:
      - Templates
      summary: Activate a template after governance approval
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Template activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateRecord'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/templates/{id}:
    get:
      tags:
      - Templates
      summary: Get template by id
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Template returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateRecord'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/credentials:
    post:
      tags:
      - Credentials
      summary: Issue a verifiable credential
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialIssueRequest'
            examples:
              internal-vc-jwt:
                $ref: '#/components/examples/internal-vc-jwt-request'
              ethereum-vc-ldp:
                $ref: '#/components/examples/ethereum-vc-ldp-request'
      responses:
        '200':
          description: Credential issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialIssueResult'
              examples:
                internal-vc-jwt:
                  $ref: '#/components/examples/internal-vc-jwt-response'
                ethereum-vc-ldp:
                  $ref: '#/components/examples/ethereum-vc-ldp-response'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
      - Credentials
      summary: List issued credentials for a tenant
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Issued credentials returned
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/CredentialIssueResult'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/CredentialIssueResult'
                    page:
                      type: integer
                    limit:
                      type: integer
                    total:
                      type: integer
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/credentials/verify:
    post:
      tags:
      - Credentials
      summary: Verify a credential
      parameters:
      - $ref: '#/components/parameters/Driver'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialVerifyRequest'
      responses:
        '200':
          description: Credential verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialVerifyResult'
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/verify-credential:
    post:
      tags:
      - Verification
      summary: Verify a credential via alias route
      parameters:
      - $ref: '#/components/parameters/Driver'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialVerifyRequest'
      responses:
        '200':
          description: Credential verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialVerifyResult'
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/presentations:
    post:
      tags:
      - Presentations
      summary: Create a presentation
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresentationCreateRequest'
      responses:
        '200':
          description: Presentation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentationRecord'
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/presentations/verify:
    post:
      tags:
      - Presentations
      summary: Verify a presentation
      parameters:
      - $ref: '#/components/parameters/Driver'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresentationVerifyRequest'
            examples:
              internal-presentation-verify:
                $ref: '#/components/examples/internal-presentation-verify-request'
              ethereum-presentation-verify:
                $ref: '#/components/examples/ethereum-presentation-verify-request'
      responses:
        '200':
          description: Presentation verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentationVerifyResult'
              examples:
                internal-presentation-verify:
                  $ref: '#/components/examples/internal-presentation-verify-response'
                ethereum-presentation-verify:
                  $ref: '#/components/examples/ethereum-presentation-verify-response'
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/verify-presentation:
    post:
      tags:
      - Verification
      summary: Verify a presentation via alias route
      parameters:
      - $ref: '#/components/parameters/Driver'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresentationVerifyRequest'
            examples:
              internal-presentation-verify:
                $ref: '#/components/examples/internal-presentation-verify-request'
      responses:
        '200':
          description: Presentation verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentationVerifyResult'
              examples:
                internal-presentation-verify:
                  $ref: '#/components/examples/internal-presentation-verify-response'
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/tenants:
    post:
      tags:
      - Tenants
      summary: Create a tenant
      parameters:
      - $ref: '#/components/parameters/Driver'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreateRequest'
      responses:
        '200':
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantRecord'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
      - Tenants
      summary: List tenants
      parameters:
      - $ref: '#/components/parameters/Driver'
      security: []
      responses:
        '200':
          description: Tenants returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantRecord'
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/tenants/{id}:
    get:
      tags:
      - Tenants
      summary: Get tenant by id
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/Id'
      security: []
      responses:
        '200':
          description: Tenant returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantRecord'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/tenants/{id}/policies:
    post:
      tags:
      - Tenants
      summary: Apply a tenant policy after governance approval
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantPolicyRequest'
      responses:
        '200':
          description: Tenant updated with new policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantRecord'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/trust-registry:
    post:
      tags:
      - Trust
      summary: Create or update a trust registry entry in draft or pending state
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustRegistryRequest'
            examples:
              internal-trust:
                $ref: '#/components/examples/internal-trust-request'
              bitcoin-hybrid-trust:
                $ref: '#/components/examples/bitcoin-hybrid-trust-request'
              ethereum-hybrid-trust:
                $ref: '#/components/examples/ethereum-hybrid-trust-request'
      responses:
        '200':
          description: Trust registry entry stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustRegistryRecord'
              examples:
                internal-trust:
                  $ref: '#/components/examples/internal-trust-response'
                bitcoin-hybrid-trust:
                  $ref: '#/components/examples/bitcoin-hybrid-trust-response'
                ethereum-hybrid-trust:
                  $ref: '#/components/examples/ethereum-hybrid-trust-response'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
      - Trust
      summary: Query trust registry entries
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/TenantQuery'
      - name: registryId
        in: query
        schema:
          type: string
      - name: entityType
        in: query
        schema:
          type: string
      - name: entityId
        in: query
        schema:
          type: string
      - name: did
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      - name: trustFrameworkId
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Trust registry entries returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrustRegistryRecord'
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/trust-registry/{id}/activate:
    post:
      tags:
      - Trust
      summary: Activate a trust registry entry after governance approval
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Trust registry entry activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustRegistryRecord'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/trust-registry/{id}:
    get:
      tags:
      - Trust
      summary: Get trust registry entry by id
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Trust registry entry returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustRegistryRecord'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/governance/proposals:
    post:
      tags:
      - Governance
      summary: Create a governance proposal
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GovernanceProposalRequest'
            examples:
              internal-governance:
                $ref: '#/components/examples/internal-governance-request'
              ethereum-governance:
                $ref: '#/components/examples/ethereum-governance-request'
      responses:
        '200':
          description: Governance proposal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceProposal'
              examples:
                internal-governance:
                  $ref: '#/components/examples/internal-governance-response'
                ethereum-governance:
                  $ref: '#/components/examples/ethereum-governance-response'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
      - Governance
      summary: Query governance proposals
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/TenantQuery'
      responses:
        '200':
          description: List of governance proposals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GovernanceProposal'
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/governance/proposals/{id}:
    get:
      tags:
      - Governance
      summary: Get governance proposal
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Governance proposal returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceProposal'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /{driver}/governance/proposals/{id}/approve:
    post:
      tags:
      - Governance
      summary: Approve a governance proposal
      parameters:
      - $ref: '#/components/parameters/Driver'
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GovernanceApprovalRequest'
            examples:
              internal-governance-approval:
                $ref: '#/components/examples/internal-governance-approval-request'
      responses:
        '200':
          description: Governance proposal updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceProposal'
              examples:
                internal-governance-approved:
                  $ref: '#/components/examples/internal-governance-approved-response'
